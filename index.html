<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>💰 การเงิน — ค่ายหล่อ(ว์)เกียร์ Intania ครั้งที่ 12</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Mitr:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink-50:#fff0f6;--pink-100:#ffd6e7;--pink-200:#ffadd2;
      --pink-400:#f759ab;--pink-500:#eb2f96;
      --rose:#ff6b9d;--blush:#ffb3c6;--cream:#fff8fb;
      --text-main:#3d1c2e;--text-sub:#a07090;--border:#f5c6d8;
      --green:#34a853;--red:#e8334a;
      --shadow-s:0 2px 12px rgba(235,47,150,.08);
      --shadow-m:0 6px 28px rgba(235,47,150,.13);
      --shadow-l:0 16px 48px rgba(235,47,150,.18);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Sarabun',sans-serif;background:var(--cream);color:var(--text-main);min-height:100vh;overflow-x:hidden}
    .blob{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(60px);opacity:.4}
    .blob-1{width:500px;height:500px;top:-150px;right:-120px;background:#ffd6e7}
    .blob-2{width:340px;height:340px;bottom:-90px;left:-90px;background:#ffb3c6}
    
    header{position:sticky;top:0;z-index:200;background:rgba(255,248,251,.85);backdrop-filter:blur(16px);border-bottom:1.5px solid var(--border)}
    .header-inner{max-width:1200px;margin:0 auto;padding:0 1.5rem;display:flex;align-items:center;gap:1rem;height:72px}
    .logo-wrap{display:flex;align-items:center;gap:.75rem;flex-shrink:0}
    .logo-img{width:42px;height:42px;border-radius:10px;object-fit:cover;border:1.5px solid var(--border);background:var(--pink-50)}
    .logo-title{font-family:'Mitr',sans-serif;font-weight:600;font-size:0.95rem;color:var(--pink-500);line-height:1.2}
    .logo-sub{font-size:.65rem;color:var(--text-sub)}

    .header-actions{display:flex;align-items:center;gap:.5rem}
    .btn{display:inline-flex;align-items:center;gap:.35rem;padding:.45rem 1rem;border-radius:999px;border:none;cursor:pointer;font-family:'Sarabun',sans-serif;font-size:.82rem;font-weight:500;transition:all .2s;white-space:nowrap}
    .btn-primary{background:linear-gradient(135deg,#ff6b9d,#f759ab);color:#fff;box-shadow:0 2px 10px rgba(235,47,150,.2)}
    .btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--text-sub)}
    .btn-ghost{background:transparent;color:var(--text-sub)}

    main{max-width:1200px;margin:0 auto;padding:1.5rem 1rem;position:relative;z-index:1}
    .dept-tabs-wrap{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.5rem;margin-bottom:1.2rem;scrollbar-width:none}
    .dept-tabs-wrap::-webkit-scrollbar{display:none}
    .dept-tab{padding:.45rem 1rem;border-radius:999px;border:1.5px solid transparent;background:#fff;cursor:pointer;font-size:.82rem;white-space:nowrap;box-shadow:var(--shadow-s)}
    .dept-tab.active{color:#fff}

    .summary-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));gap:.75rem;margin-bottom:1.5rem}
    .sum-card{background:#fff;border-radius:16px;padding:1rem;border:1.5px solid var(--border);box-shadow:var(--shadow-s)}
    .sum-label{font-size:.7rem;color:var(--text-sub);font-weight:600;margin-bottom:.3rem}
    .sum-value{font-family:'Mitr',sans-serif;font-size:1.2rem;font-weight:600}

    /* Table Styles สำหรับมือถือ */
    .table-card{background:#fff;border-radius:18px;border:1.5px solid var(--border);box-shadow:var(--shadow-s);overflow:hidden}
    .table-container{width:100%;overflow-x:auto; -webkit-overflow-scrolling:touch;}
    table{width:100%;border-collapse:collapse;min-width:700px}
    thead th{padding:.75rem;text-align:left;font-size:.72rem;background:var(--pink-50);border-bottom:1.5px solid var(--border);color:var(--text-sub)}
    tbody td{padding:.75rem;font-size:.82rem;border-bottom:1px solid var(--pink-50)}
    
    .type-badge{padding:.15rem .5rem;border-radius:999px;font-size:.7rem;font-weight:600}
    .badge-in{background:#ecfdf5;color:#059669;border:1px solid #a7f3d0}
    .badge-out{background:#fff1f2;color:#e11d48;border:1px solid #fecdd3}
    
    .slip-btn{display:inline-flex;padding:.25rem .6rem;border-radius:6px;background:var(--pink-50);color:var(--rose);border:1px solid var(--blush);font-size:.72rem;text-decoration:none;font-weight:600}
    
    /* Modal Styles */
    .modal-backdrop{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:1rem}
    .modal-backdrop.open{display:flex}
    .modal{background:#fff;border-radius:20px;padding:1.5rem;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
    .form-group{margin-bottom:.8rem}
    .form-label{display:block;font-size:.78rem;font-weight:600;margin-bottom:.25rem}
    .form-input{width:100%;padding:.55rem .8rem;border-radius:10px;border:1.5px solid var(--border);font-family:inherit;font-size:.88rem}

    @media(max-width:600px){
      .logo-sub{display:none}
      .logo-title{font-size:0.8rem}
      .header-inner{padding:0 .75rem}
      .sum-value{font-size:1.1rem}
      thead th:nth-child(1), tbody td:nth-child(1) { display: none; } /* ซ่อนลำดับในมือถือ */
    }
  </style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<header>
  <div class="header-inner">
    <div class="logo-wrap">
      <img class="logo-img" src="https://drive.google.com/thumbnail?id=1JkF6t_Pb-NiergzLbKXBTz0P43CebXNi&sz=w200" alt="Gear Logo" onerror="this.src='https://via.placeholder.com/40?text=Gear'">
      <div>
        <div class="logo-title">หล่อ(ว์)เกียร์ 12</div>
        <div class="logo-sub">Engineering Student Union</div>
      </div>
    </div>
    <div style="flex:1"></div>
    <div class="header-actions">
      <span class="admin-chip" id="adminChip">✨ Admin</span>
      <button class="btn btn-primary" id="addBtn" style="display:none" onclick="openAddModal()">➕ เพิ่ม</button>
      <button class="btn btn-ghost" id="loginBtn" onclick="openModal('loginModal')">🔐</button>
      <button class="btn btn-ghost" id="logoutBtn" style="display:none" onclick="logout()">🚪</button>
    </div>
  </div>
</header>

<main>
  <div class="dept-tabs-wrap" id="deptTabs"></div>

  <div class="summary-grid">
    <div class="sum-card"><div class="sum-label">💚 รายรับ</div><div class="sum-value" id="sumIncome" style="color:var(--green)">฿0</div></div>
    <div class="sum-card"><div class="sum-label">❤️ รายจ่าย</div><div class="sum-value" id="sumExpense" style="color:var(--red)">฿0</div></div>
    <div class="sum-card"><div class="sum-label">🌸 คงเหลือ</div><div class="sum-value" id="sumBalance" style="color:var(--pink-500)">฿0</div></div>
  </div>

  <div class="table-card">
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width:40px">#</th>
            <th style="width:100px">วันที่</th>
            <th style="width:90px">ประเภท</th>
            <th>รายการ</th>
            <th style="width:100px">รับ/จ่าย</th>
            <th style="width:100px">คงเหลือ</th>
            <th style="width:80px">สลิป</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="7" style="text-align:center;padding:2rem">⏳ กำลังโหลด...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal-backdrop" id="loginModal">
  <div class="modal">
    <div class="form-label" style="font-size:1.1rem;margin-bottom:1rem">🔐 เข้าสู่ระบบ Admin</div>
    <input type="password" class="form-input" id="pwInput" placeholder="รหัสผ่าน">
    <div id="loginErr" style="color:red;font-size:0.7rem;margin-top:5px;display:none">รหัสผ่านผิด!</div>
    <div style="display:flex;gap:10px;margin-top:1.5rem">
      <button class="btn btn-outline" style="flex:1" onclick="closeModal('loginModal')">ยกเลิก</button>
      <button class="btn btn-primary" style="flex:1" onclick="doLogin()">ตกลง</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="addModal">
  <div class="modal">
    <div class="form-label" style="font-size:1.1rem;margin-bottom:1rem">➕ เพิ่มรายการใหม่</div>
    <div class="form-group">
      <label class="form-label">วันที่</label>
      <input type="date" class="form-input" id="eDate">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="form-group">
          <label class="form-label">ประเภท</label>
          <select class="form-input" id="eType">
            <option value="รายรับ">รายรับ</option>
            <option value="รายจ่าย">รายจ่าย</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">ฝ่าย</label>
          <select class="form-input" id="eDept"></select>
        </div>
    </div>
    <div class="form-group">
      <label class="form-label">รายการ</label>
      <input type="text" class="form-input" id="eName" placeholder="เช่น ค่าสติ๊กเกอร์">
    </div>
    <div class="form-group">
      <label class="form-label">จำนวนเงิน (฿)</label>
      <input type="number" class="form-input" id="eAmount" placeholder="0.00">
    </div>
    <div class="form-group">
      <label class="form-label">รูปสลิป</label>
      <input type="file" class="form-input" id="eFile" accept="image/*">
    </div>
    <div class="form-group">
      <label class="form-label">หมายเหตุ</label>
      <input type="text" class="form-input" id="eNote">
    </div>
    <div id="addErr" style="color:red;font-size:0.7rem;display:none;margin-bottom:10px">กรุณากรอกข้อมูลให้ครบ!</div>
    <button class="btn btn-primary" id="saveBtn" style="width:100%;justify-content:center;padding:0.8rem" onclick="saveEntry()">💾 บันทึกข้อมูล</button>
    <button class="btn btn-ghost" style="width:100%;margin-top:5px" onclick="closeModal('addModal')">ปิด</button>
  </div>
</div>

<script>
const CONFIG = {
  ADMIN_PASSWORD: 'lgi12',
  SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwkIuBtOOaZAC3AgM0O1w64gQNNUjeatI3ARADfiFmKVETFGvGRWl6Txka13nYI3x2-/exec',
  DEPTS: [
    { name:'รวม', sheetId:'', sheetName:'', color:'#f472b6', emoji:'🌸' },
    { name:'การเงิน', sheetId:'1vue2VP7C7Qba_tEeebQEgdERyhY1JK_FQEjeTR4GHEY', sheetName:'ฝ่ายการเงิน', color:'#f472b6', emoji:'💰' },
    { name:'สถานที่', sheetId:'1vue2VP7C7Qba_tEeebQEgdERyhY1JK_FQEjeTR4GHEY', sheetName:'ฝ่ายสถานที่', color:'#60a5fa', emoji:'🏕️' },
    { name:'สันทนาการ', sheetId:'1vue2VP7C7Qba_tEeebQEgdERyhY1JK_FQEjeTR4GHEY', sheetName:'ฝ่ายสันทนาการ', color:'#fb923c', emoji:'🎮' },
    { name:'สวัสดิการ', sheetId:'1vue2VP7C7Qba_tEeebQEgdERyhY1JK_FQEjeTR4GHEY', sheetName:'ฝ่ายสวัสดิการ', color:'#34d399', emoji:'🍱' },
    { name:'พยาบาล', sheetId:'1vue2VP7C7Qba_tEeebQEgdERyhY1JK_FQEjeTR4GHEY', sheetName:'ฝ่ายพยาบาล', color:'#f87171', emoji:'🏥' },
    { name:'มินิมาร์ท', sheetId:'1vue2VP7C7Qba_tEeebQEgdERyhY1JK_FQEjeTR4GHEY', sheetName:'ฝ่ายมินิมาร์ทและจัดหาทุน', color:'#a78bfa', emoji:'🛒' },
    { name:'วิชาการ', sheetId:'1vue2VP7C7Qba_tEeebQEgdERyhY1JK_FQEjeTR4GHEY', sheetName:'ฝ่ายวิชาการ', color:'#2dd4bf', emoji:'📚' }
  ]
};

let allData=[], isAdmin=false, activeDept=0;

document.addEventListener('DOMContentLoaded',()=>{
  buildTabs(); buildDeptSelect();
  if(sessionStorage.getItem('adminAuth')==='true'){isAdmin=true;updateAdminUI();}
  loadData();
});

function buildTabs(){
  document.getElementById('deptTabs').innerHTML=CONFIG.DEPTS.map((d,i)=>`
    <button class="dept-tab ${i===activeDept?'active':''}" 
      style="border-color:${d.color}; ${i===activeDept?'background:'+d.color:''}" 
      onclick="switchDept(${i})">${d.emoji} ${d.name}</button>`).join('');
}

function buildDeptSelect(){
  document.getElementById('eDept').innerHTML=CONFIG.DEPTS.slice(1).map((d,i)=>`<option value="${i+1}">${d.name}</option>`).join('');
}

function switchDept(i){ activeDept=i; buildTabs(); loadData(); }

async function loadData(){
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML='<tr><td colspan="7" style="text-align:center;padding:2rem">⏳ กำลังโหลด...</td></tr>';
  
  if(activeDept===0){
    const r=await Promise.all(CONFIG.DEPTS.slice(1).map(d=>fetchSheet(d.sheetId,d.sheetName)));
    allData=r.flat().sort((a,b)=>a.rawDate-b.rawDate);
  } else {
    allData=await fetchSheet(CONFIG.DEPTS[activeDept].sheetId, CONFIG.DEPTS[activeDept].sheetName);
  }
  renderUI();
}

async function fetchSheet(id,name){
  if(!id) return [];
  try{
    const res=await fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(name)}&t=${Date.now()}`);
    const text=await res.text();
    const json=JSON.parse(text.substring(47,text.length-2));
    return (json.table.rows||[]).map(row=>{
      const c=row.c;
      return {
        date: c[0]?.f || '',
        rawDate: c[0]?.v ? eval('new '+c[0].v).getTime() : 0,
        type: c[1]?.v || '',
        name: c[2]?.v || '',
        income: c[3]?.v || 0,
        expense: c[4]?.v || 0,
        balance: c[5]?.v || 0,
        slip: c[6]?.v || '',
        note: c[7]?.v || ''
      };
    }).filter(r=>r.name);
  }catch(e){ return []; }
}

function renderUI(){
  const tbody=document.getElementById('tableBody');
  const ti=allData.reduce((s,r)=>s+r.income,0);
  const te=allData.reduce((s,r)=>s+r.expense,0);
  const lb=allData.length?allData[allData.length-1].balance:0;

  document.getElementById('sumIncome').textContent='฿'+ti.toLocaleString();
  document.getElementById('sumExpense').textContent='฿'+te.toLocaleString();
  document.getElementById('sumBalance').textContent='฿'+lb.toLocaleString();

  tbody.innerHTML=allData.map((r,i)=>`
    <tr>
      <td>${i+1}</td>
      <td style="font-size:0.75rem">${r.date}</td>
      <td><span class="type-badge ${r.type==='รายรับ'?'badge-in':'badge-out'}">${r.type}</span></td>
      <td style="font-weight:500">${r.name}</td>
      <td style="color:${r.income>0?'var(--green)':'var(--red)'}">${r.income>0?'+'+r.income: '-'+r.expense}</td>
      <td style="font-weight:600">฿${r.balance.toLocaleString()}</td>
      <td>${r.slip ? `<a class="slip-btn" href="${r.slip}" target="_blank">📄 สลิป</a>` : '<span style="color:#ccc">—</span>'}</td>
    </tr>
  `).join('');
}

async function saveEntry(){
  const date=document.getElementById('eDate').value;
  const name=document.getElementById('eName').value;
  const amount=document.getElementById('eAmount').value;
  const type=document.getElementById('eType').value;
  const deptIdx=document.getElementById('eDept').value;
  const fileInput=document.getElementById('eFile');

  if(!date || !name || !amount){
    document.getElementById('addErr').style.display='block';
    return;
  }

  const btn=document.getElementById('saveBtn');
  btn.disabled=true; btn.textContent='⏳ กำลังบันทึก...';

  const payload = new URLSearchParams();
  payload.append('date', date);
  payload.append('type', type);
  payload.append('name', name);
  payload.append('income', type==='รายรับ'?amount:0);
  payload.append('expense', type==='รายจ่าย'?amount:0);
  payload.append('sheetId', CONFIG.DEPTS[deptIdx].sheetId);
  payload.append('sheetName', CONFIG.DEPTS[deptIdx].sheetName);
  payload.append('note', document.getElementById('eNote').value);

  if (fileInput.files.length > 0) {
    const file = fileInput.files[0];
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = async () => {
      payload.append('fileBase64', reader.result.split(',')[1]);
      payload.append('fileType', file.type);
      sendRequest(payload);
    };
  } else {
    sendRequest(payload);
  }
}

async function sendRequest(payload){
  try{
    const res=await fetch(CONFIG.SCRIPT_URL, { method:'POST', body:payload });
    const r=await res.json();
    if(r.status==='ok'){ alert('บันทึกสำเร็จ!'); location.reload(); }
    else{ alert('Error: '+r.message); }
  }catch(e){ alert('ส่งข้อมูลไม่สำเร็จ'); }
}

function doLogin(){
  if(document.getElementById('pwInput').value===CONFIG.ADMIN_PASSWORD){
    isAdmin=true; sessionStorage.setItem('adminAuth','true');
    updateAdminUI(); closeModal('loginModal');
  } else { document.getElementById('loginErr').style.display='block'; }
}
function logout(){ isAdmin=false; sessionStorage.removeItem('adminAuth'); updateAdminUI(); }
function updateAdminUI(){
  document.getElementById('adminChip').style.display=isAdmin?'inline-block':'none';
  document.getElementById('addBtn').style.display=isAdmin?'inline-flex':'none';
  document.getElementById('loginBtn').style.display=isAdmin?'none':'inline-flex';
  document.getElementById('logoutBtn').style.display=isAdmin?'inline-flex':'none';
}
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
function openAddModal(){ document.getElementById('eDate').value=new Date().toISOString().split('T')[0]; openModal('addModal'); }
</script>
</body>
</html>
